<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Rickware - Labs© Labcord V1</title>
    <link rel="preconnect" href="https://rickware-labs-api.apps.bot-hosting.cloud" crossorigin>
    <link rel="stylesheet" href="../css/rwl_frames.css">
    <link rel="stylesheet" href="../css/rwl_social.css">
    <link rel="stylesheet" href="../css/labcord.css">
    <link rel="icon" type="image/webp" href="../images/main/logo.webp">
    <script src="../js/rwl_boot.js" data-i18n-extra="community"></script>
</head>
<body class="labcord">
    <div class="lc-app" id="lcApp">
        <nav class="lc-rail" id="lcRail" aria-label="Servers">
            <button type="button" class="lc-rail-btn lc-rail-home active" id="lcHome" title="Direct Messages And Friends">
                <img src="../images/main/logo.webp" alt="" decoding="async">
                <span class="lc-rail-badge" id="lcHomeBadge" hidden></span>
            </button>
            <div class="lc-rail-line"></div>
            <div class="lc-rail-servers" id="lcServers"></div>
            <button type="button" class="lc-rail-btn lc-rail-add" id="lcAddServer" title="Create Or Join A Server">+</button>
            <a class="lc-rail-btn lc-rail-back" href="../index.html" title="Back To The Launcher">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
            </a>
        </nav>
        <aside class="lc-side" id="lcSide">
            <header class="lc-side-head" id="lcSideHead"></header>
            <div class="lc-side-body" id="lcSideBody"></div>
            <footer class="lc-user" id="lcUser"></footer>
        </aside>
        <main class="lc-main" id="lcMain">
            <button type="button" class="lc-side-toggle" id="lcSideToggle" title="Show Or Hide The Channel List" aria-label="Show Or Hide The Channel List">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <section class="lc-view" id="lcView"></section>
            <div class="lc-chat-dock" id="lcChatDock"></div>
        </main>
        <aside class="lc-members" id="lcMembers"></aside>
    </div>
    <div class="lc-modal-layer" id="lcModalLayer" hidden></div>
    <div class="lc-toast" id="lcToast" hidden></div>

    <script>window.RWL_SURFACE = 'labcord';</script>
    <script src="../js/api_client.js"></script>
    <script src="../js/launcher_bridge.js"></script>
    <script src="../js/rwl_fx.js"></script>
    <script src="../js/rwl_social.js"></script>
    <script src="../js/rwl_groups.js"></script>
    <script src="../js/rwl_gifts.js"></script>
    <script src="../js/labcord.js"></script>
</body>
</html>
