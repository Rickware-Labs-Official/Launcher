<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rickware - Labs© - Mystery Chest</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#05050a;
overflow:hidden;
}

.bg{
position:absolute;
inset:0;
background:
radial-gradient(circle at 50% 40%,rgba(170,0,255,0.25),transparent 60%),
linear-gradient(120deg,#04040a,#0b0b18);
}

.container{
width:100%;
max-width:1000px;
padding:20px;
z-index:2;
position:relative;
display:flex;
flex-direction:column;
align-items:center;
gap:30px;
}

.frame{
width:100%;
height:210px;
border-radius:18px;
position:relative;
overflow:hidden;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(16px);
box-shadow:0 0 80px rgba(170,0,255,0.2);
border:1px solid rgba(160,0,255,0.15);
}

.frame::before{
content:"";
position:absolute;
inset:0;
border-radius:18px;
padding:2px;
background:linear-gradient(90deg,
rgba(180,0,255,0.9),
rgba(120,0,255,0.2),
rgba(180,0,255,0.9)
);
mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);
mask-composite:exclude;
opacity:.8;
pointer-events:none;
}

.centerLine{
position:absolute;
top:0;
left:50%;
width:3px;
height:100%;
transform:translateX(-50%);
background:linear-gradient(to bottom,transparent,#c200ff,transparent);
box-shadow:0 0 18px #c200ff;
z-index:5;
}

.viewport{
position:absolute;
inset:10px;
border-radius:14px;
overflow:hidden;
}

.track{
display:flex;
gap:14px;
position:absolute;
height:100%;
align-items:center;
padding:0 120px;
will-change:transform;
transform:translateZ(0);
}

.item{
min-width:150px;
height:130px;
border-radius:14px;
overflow:hidden;
background:rgba(255,255,255,0.05);
border:1px solid rgba(180,80,255,0.25);
flex-shrink:0;
}

.item img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.spinBtn{
width:420px;
padding:18px;
font-size:20px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#b100ff,#5200ff);
color:white;
cursor:pointer;
box-shadow:0 0 60px rgba(170,0,255,0.5);
animation:float 2s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-6px)}
}

.win{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.75);
backdrop-filter:blur(10px);
opacity:0;
pointer-events:none;
transition:.25s;
z-index:9999;
}

.win.active{
opacity:1;
pointer-events:auto;
}

.box{
width:360px;
height:360px;
border-radius:18px;
overflow:hidden;
background:rgba(255,255,255,0.05);
border:1px solid rgba(180,80,255,0.4);
box-shadow:0 0 120px rgba(170,0,255,0.5);
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.topBtn{
position:absolute;
top:15px;
width:44px;
height:44px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
background:rgba(255,255,255,0.06);
border:1px solid rgba(180,80,255,0.3);
z-index:10000;
}

.close{right:15px}
.back{left:15px}

.box img{
width:100%;
height:100%;
object-fit:cover;
}

.item video{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.item .swatch,.box .swatch{
width:100%;
height:100%;
display:flex;
align-items:flex-end;
justify-content:center;
padding:10px;
}

.item .swatch span,.box .caption{
background:rgba(5,5,10,0.72);
color:#fff;
font-size:12px;
font-weight:700;
padding:4px 10px;
border-radius:8px;
text-align:center;
max-width:100%;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.item img.contain,.box img.contain{
object-fit:contain;
padding:8px;
}

.box video{
width:100%;
height:100%;
object-fit:cover;
}

.box .result{
position:relative;
width:100%;
height:100%;
}

.box .caption{
position:absolute;
left:50%;
bottom:14px;
transform:translateX(-50%);
display:flex;
flex-direction:column;
gap:2px;
font-size:14px;
white-space:normal;
width:max-content;
max-width:90%;
}

.box .caption small{
font-size:11px;
font-weight:600;
opacity:0.85;
}

.spinBtn:disabled{
cursor:not-allowed;
opacity:0.75;
animation:none;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<div class="frame">
<div class="viewport">
<div class="centerLine"></div>
<div class="track" id="track"></div>
</div>
</div>

<button class="spinBtn" id="spin">SPIN CHEST</button>
</div>

<div class="win" id="win">
<div class="topBtn back" id="back">←</div>
<div class="topBtn close" id="close">✕</div>
<div class="box" id="box"></div>
</div>

<script src="../js/api_client.js"></script>
<script>
(function(){
const idleImages=[
"../images/assets/inventory/avatar_decos_main.webp",
"../images/assets/inventory/nameplates_main.webp",
"../images/assets/inventory/name_colors_main.webp",
"../images/assets/inventory/themes_main.webp",
"../images/assets/inventory/licenses_main.webp"
]
const ITEM_WIDTH=150
const ITEM_GAP=14
const TRACK_PADDING=120
const SPIN_DURATION_MS=6800

const track=document.getElementById("track")
const spin=document.getElementById("spin")
const win=document.getElementById("win")
const box=document.getElementById("box")
const esc=RWL.escapeHtml

let pos=0
let raf=null
let opening=false
let openedAny=false

function itemVisualHtml(item,large){
if(!item)return '<img src="'+idleImages[0]+'" alt="">'
if(item.category==="name_colors"){
return '<div class="swatch" style="'+esc(RWL.swatchStyle(item))+'"><span>'+esc(item.name)+'</span></div>'
}
if(item.category==="nameplates"&&item.asset_url){
return '<video src="'+esc(item.asset_url)+'" muted loop playsinline preload="'+(large?"auto":"metadata")+'"'+(large?" autoplay":"")+'></video>'
}
if(item.asset_url){
return '<img class="contain" src="'+esc(item.asset_url)+'" alt="">'
}
return '<div class="swatch"><span>'+esc(item.name||"Item")+'</span></div>'
}

function buildIdle(){
track.innerHTML=""
for(let i=0;i<50;i++){
const d=document.createElement("div")
d.className="item"
d.innerHTML='<img src="'+idleImages[Math.floor(Math.random()*idleImages.length)]+'" alt="">'
track.appendChild(d)
}
}

function idleLoop(){
pos+=6
if(pos>2400)pos=0
track.style.transform="translateX("+(-pos)+"px)"
raf=requestAnimationFrame(idleLoop)
}

function startIdle(){
cancelAnimationFrame(raf)
pos=0
buildIdle()
idleLoop()
}

function buildReel(reel){
track.innerHTML=""
reel.forEach(function(item){
const d=document.createElement("div")
d.className="item"
d.style.borderColor=RWL.rarityColor(item&&item.rarity)
d.innerHTML=itemVisualHtml(item,false)
track.appendChild(d)
})
}

function easeOutQuart(t){
return 1-Math.pow(1-t,4)
}

function animateTo(target,done){
cancelAnimationFrame(raf)
const start=performance.now()
function step(now){
const progress=Math.min(1,(now-start)/SPIN_DURATION_MS)
pos=target*easeOutQuart(progress)
track.style.transform="translateX("+(-pos)+"px)"
if(progress<1){
raf=requestAnimationFrame(step)
}else{
done()
}
}
raf=requestAnimationFrame(step)
}

function setButton(text,disabled){
spin.textContent=text
spin.disabled=!!disabled
}

function chestButtonLabel(chests){
if(!chests)return "SPIN CHEST"
if(chests.unlimited)return "SPIN CHEST (∞)"
return chests.balance>0?"SPIN CHEST ("+chests.balance+" LEFT)":"NO CHESTS LEFT"
}

function finish(result){
const reward=result.reward||{}
const notes=[]
if(reward.duplicate){
notes.push(reward.compensation_lab_coins?"Duplicate · +"+reward.compensation_lab_coins+" LC":"Duplicate · already owned")
}
box.style.borderColor=RWL.rarityColor(reward.rarity)
box.innerHTML='<div class="result">'+itemVisualHtml(reward,true)+'<div class="caption">'+esc(reward.name||"Item")+'<small style="color:'+esc(RWL.rarityColor(reward.rarity))+';">'+esc((reward.rarity||"")+" "+(reward.category_label||""))+'</small>'+(notes.length?'<small>'+esc(notes.join(" · "))+'</small>':"")+'</div></div>'
win.classList.add("active")
const chests=result.chests||{}
setButton(chestButtonLabel(chests),!chests.unlimited&&!(chests.balance>0))
opening=false
}

async function spinChest(){
if(opening)return
if(!RWL.getToken()){
setButton("LOGIN REQUIRED",true)
return
}
opening=true
setButton("OPENING...",true)
let result
try{
result=await RWL.apiRequest("/api/chests/open",{method:"POST"})
}catch(error){
opening=false
const noChests=error.status===400
setButton(noChests?"NO CHESTS LEFT":"TRY AGAIN",noChests)
if(!noChests)setTimeout(function(){setButton("SPIN CHEST",false)},2500)
return
}
openedAny=true
const reel=Array.isArray(result.reel)&&result.reel.length?result.reel:[result.reward]
const winIndex=Math.max(0,Math.min(result.win_index||0,reel.length-1))
buildReel(reel)
pos=0
track.style.transform="translateX(0px)"
const viewport=track.parentElement
const center=viewport.clientWidth/2
const jitter=(Math.random()-0.5)*(ITEM_WIDTH*0.6)
const target=TRACK_PADDING+winIndex*(ITEM_WIDTH+ITEM_GAP)+ITEM_WIDTH/2-center+jitter
animateTo(Math.max(0,target),function(){finish(result)})
}

function backToChest(){
win.classList.remove("active")
box.innerHTML=""
if(!spin.disabled)startIdle()
}

function exitChest(){
win.classList.remove("active")
window.parent.postMessage({type:"chest_opening_done",opened:openedAny},window.location.origin)
}

async function loadSummary(){
if(!RWL.getToken()){
setButton("LOGIN REQUIRED",true)
return
}
try{
const chests=await RWL.apiRequest("/api/chests")
setButton(chestButtonLabel(chests),!chests.unlimited&&!(chests.balance>0))
}catch(error){
setButton("SPIN CHEST",false)
}
}

spin.onclick=spinChest
document.getElementById("close").onclick=exitChest
document.getElementById("back").onclick=backToChest
win.onclick=function(e){
if(e.target===win)backToChest()
}
document.addEventListener("keydown",function(e){
if(e.key==="Escape"){
if(win.classList.contains("active"))backToChest()
else exitChest()
}
})

RWL.ensureCosmeticStyles()
startIdle()
loadSummary()
})()
</script>

</body>
</html>
