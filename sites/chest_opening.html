<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rickware - Labs© - Mystery Chest</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#05050a;
overflow:hidden;
}

.bg{
position:absolute;
inset:0;
background:
radial-gradient(circle at 50% 40%,rgba(170,0,255,0.25),transparent 60%),
linear-gradient(120deg,#04040a,#0b0b18);
}

.container{
width:100%;
max-width:1000px;
padding:20px;
z-index:2;
position:relative;
display:flex;
flex-direction:column;
align-items:center;
gap:30px;
}

.frame{
width:100%;
height:210px;
border-radius:18px;
position:relative;
overflow:hidden;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(16px);
box-shadow:0 0 80px rgba(170,0,255,0.2);
border:1px solid rgba(160,0,255,0.15);
}

.frame::before{
content:"";
position:absolute;
inset:0;
border-radius:18px;
padding:2px;
background:linear-gradient(90deg,
rgba(180,0,255,0.9),
rgba(120,0,255,0.2),
rgba(180,0,255,0.9)
);
mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);
mask-composite:exclude;
opacity:.8;
pointer-events:none;
}

.centerLine{
position:absolute;
top:0;
left:50%;
width:3px;
height:100%;
transform:translateX(-50%);
background:linear-gradient(to bottom,transparent,#c200ff,transparent);
box-shadow:0 0 18px #c200ff;
z-index:5;
}

.viewport{
position:absolute;
inset:10px;
border-radius:14px;
overflow:hidden;
}

.track{
display:flex;
gap:14px;
position:absolute;
height:100%;
align-items:center;
padding:0 120px;
will-change:transform;
transform:translateZ(0);
}

.item{
min-width:150px;
height:130px;
border-radius:14px;
overflow:hidden;
background:rgba(255,255,255,0.05);
border:1px solid rgba(180,80,255,0.25);
flex-shrink:0;
}

.item img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.spinBtn{
width:420px;
max-width:100%;
padding:18px;
font-size:20px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#b100ff,#5200ff);
color:white;
cursor:pointer;
box-shadow:0 0 60px rgba(170,0,255,0.5);
animation:float 2s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-6px)}
}

.win{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.75);
backdrop-filter:blur(10px);
opacity:0;
pointer-events:none;
transition:.25s;
z-index:9999;
}

.win.active{
opacity:1;
pointer-events:auto;
}

.box{
width:360px;
height:360px;
border-radius:18px;
overflow:hidden;
background:rgba(255,255,255,0.05);
border:1px solid rgba(180,80,255,0.4);
box-shadow:0 0 120px rgba(170,0,255,0.5);
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.topBtn{
position:absolute;
top:15px;
width:44px;
height:44px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
background:rgba(255,255,255,0.06);
border:1px solid rgba(180,80,255,0.3);
color:#e0aaff;
z-index:10000;
}

.close{right:15px}
.back{left:15px}

.pageNav{
position:fixed;
top:16px;
width:44px;
height:44px;
border-radius:12px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:20px;
font-weight:700;
background:rgba(20,0,40,0.75);
border:1px solid rgba(180,80,255,0.45);
color:#e0aaff;
box-shadow:0 0 14px rgba(170,0,255,0.25);
z-index:10001;
transition:background .2s,box-shadow .2s,transform .2s;
}

.pageNav:hover{
background:rgba(120,0,200,0.35);
box-shadow:0 0 22px rgba(170,0,255,0.55);
transform:translateY(-1px);
}

.pageNav:focus-visible{
outline:2px solid #e0aaff;
outline-offset:2px;
}

.pageBack{left:16px}
.pageClose{right:16px}

.win.active ~ .pageBack{display:none}

.themeStripes.animatedStripes i{
flex:1;
background-size:300% 100%;
}

.box img{
width:100%;
height:100%;
object-fit:cover;
}

.item video{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.item .swatch,.box .swatch{
width:100%;
height:100%;
display:flex;
align-items:flex-end;
justify-content:center;
padding:10px;
}

.item .swatch span,.box .caption{
background:rgba(5,5,10,0.72);
color:#fff;
font-size:12px;
font-weight:700;
padding:4px 10px;
border-radius:8px;
text-align:center;
max-width:100%;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.item img.contain,.box img.contain{
object-fit:contain;
padding:8px;
}

.box video{
width:100%;
height:100%;
object-fit:cover;
}

.box .result{
position:relative;
width:100%;
height:100%;
}

.box .caption{
position:absolute;
left:50%;
bottom:14px;
transform:translateX(-50%);
display:flex;
flex-direction:column;
gap:2px;
font-size:14px;
white-space:normal;
width:max-content;
max-width:90%;
}

.box .caption small{
font-size:11px;
font-weight:600;
opacity:0.85;
}

.spinBtn:disabled{
cursor:not-allowed;
opacity:0.75;
animation:none;
}

.item.category,.box .categoryVisual{
position:relative;
}

.item.category span,.box .categoryVisual span{
position:absolute;
left:50%;
bottom:8px;
transform:translateX(-50%);
background:rgba(5,5,10,0.72);
color:#fff;
font-size:11px;
font-weight:700;
padding:3px 9px;
border-radius:8px;
white-space:nowrap;
}

.item .themeStripes,.box .themeStripes{
width:100%;
height:100%;
display:flex;
}

.item .themeStripes i,.box .themeStripes i{
flex:1;
}

.item .labelVisual,.box .labelVisual{
position:relative;
width:100%;
height:100%;
}

.item .labelVisual img,.box .labelVisual img{
object-fit:contain;
padding:6px;
}

.phaseLabel{
min-height:22px;
font-size:14px;
font-weight:700;
letter-spacing:0.08em;
text-transform:uppercase;
color:#e0aaff;
text-shadow:0 0 14px rgba(170,0,255,0.6);
text-align:center;
}

.actions{
display:flex;
flex-direction:column;
align-items:center;
gap:12px;
width:100%;
}

.openAllBtn{
width:420px;
max-width:100%;
padding:12px;
font-size:14px;
font-weight:700;
letter-spacing:0.04em;
border-radius:14px;
border:1px solid rgba(180,80,255,0.45);
background:rgba(120,0,255,0.12);
color:#e0aaff;
cursor:pointer;
box-shadow:0 0 24px rgba(170,0,255,0.25);
transition:background .2s,box-shadow .2s,transform .2s;
}

.openAllBtn:hover{
background:rgba(150,0,255,0.22);
box-shadow:0 0 34px rgba(170,0,255,0.45);
transform:translateY(-1px);
}

.openAllBtn:disabled{
cursor:not-allowed;
opacity:0.5;
transform:none;
}

.customOpen{
display:flex;
gap:8px;
align-items:center;
width:420px;
max-width:92vw;
}
.customOpen .openAllBtn{
flex:1;
width:auto;
min-width:0;
}
.customOpen[hidden]{
display:none;
}
.customOpen input{
width:110px;
height:44px;
border-radius:12px;
background:#000;
border:1px solid rgba(180,80,255,0.45);
color:#fff;
padding:0 12px;
font-size:14px;
}
.customOpen input.invalidInput{
border-color:#ff4d6d;
}
.skipToggle{
display:inline-flex;
align-items:center;
gap:6px;
color:rgba(255,255,255,0.8);
font-size:13px;
font-weight:600;
cursor:pointer;
}
.skipToggle input{
accent-color:#9d4edd;
width:16px;
height:16px;
}
.actions{
flex-wrap:wrap;
justify-content:center;
}
.summary{
width:min(760px,92vw);
max-height:78vh;
border-radius:18px;
background:rgba(12,6,24,0.92);
border:1px solid rgba(180,80,255,0.4);
box-shadow:0 0 120px rgba(170,0,255,0.45);
padding:22px;
display:flex;
flex-direction:column;
gap:14px;
overflow:hidden;
}

.summary h2{
color:#fff;
font-size:20px;
font-weight:800;
}

.summary .summaryMeta{
color:rgba(224,170,255,0.85);
font-size:13px;
font-weight:600;
}

.summaryGrid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
overflow-y:auto;
padding-right:4px;
scrollbar-width:thin;
scrollbar-color:#9b00cc rgba(255,255,255,0.05);
}

.summaryEntry{
display:flex;
flex-direction:column;
gap:3px;
padding:10px;
border-radius:12px;
border:1px solid rgba(180,80,255,0.3);
background:rgba(255,255,255,0.04);
color:rgba(255,255,255,0.75);
font-size:11px;
min-width:0;
}

.summaryEntry strong{
color:#fff;
font-size:13px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.frame{transition:box-shadow .5s ease,border-color .5s ease}
.frame.spinning{box-shadow:0 0 120px rgba(170,0,255,0.42);border-color:rgba(200,120,255,0.45)}
.frame.landed{box-shadow:0 0 130px var(--rarity,rgba(170,0,255,0.5));border-color:var(--rarity,rgba(200,120,255,0.6))}
.viewport::before,.viewport::after{content:"";position:absolute;top:0;bottom:0;width:20%;z-index:4;pointer-events:none}
.viewport::before{left:0;background:linear-gradient(90deg,#07060e 8%,transparent)}
.viewport::after{right:0;background:linear-gradient(270deg,#07060e 8%,transparent)}
.viewport.fast .track{filter:blur(1.1px) saturate(1.15)}
.centerLine{opacity:.55;transition:opacity .3s ease}
.frame.spinning .centerLine{opacity:.9}
.frame.landed .centerLine{opacity:0}
.marker{position:absolute;left:50%;width:0;height:0;margin-left:-11px;border-left:11px solid transparent;border-right:11px solid transparent;z-index:6;filter:drop-shadow(0 0 7px #c200ff);pointer-events:none}
.markerTop{top:6px;border-top:15px solid #e0aaff}
.markerBottom{bottom:6px;border-bottom:15px solid #e0aaff}
.frame.landed .marker{filter:drop-shadow(0 0 11px var(--rarity,#c200ff))}
.item{will-change:transform,opacity;transform-origin:50% 50%}
.track.landed .item{opacity:.28!important;transform:scale(.94)!important;transition:opacity .35s ease,transform .35s ease}
.track.landed .item.won{opacity:1!important;transform:scale(1.13)!important;z-index:3;border-color:var(--rarity,#c97eff)!important;box-shadow:0 0 34px var(--rarity,#c97eff);transition:transform .42s cubic-bezier(.2,1.7,.4,1),box-shadow .42s ease}
.phaseLabel.pop{animation:phasePop .42s cubic-bezier(.2,1.5,.4,1)}
@keyframes phasePop{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
.win{overflow:hidden}
.win::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,var(--rarity,rgba(170,0,255,0.5)) 0%,transparent 58%);opacity:0;transition:opacity .5s ease}
.win.active::before{opacity:.34}
.rays{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;background:repeating-conic-gradient(from 0deg,var(--rarity,#c97eff) 0deg 5deg,transparent 5deg 30deg);-webkit-mask:radial-gradient(circle,#000 0%,transparent 42%);mask:radial-gradient(circle,#000 0%,transparent 42%);opacity:0;pointer-events:none}
.win.active .rays{opacity:.16;animation:raysSpin 26s linear infinite,raysIn .7s ease-out}
@keyframes raysSpin{to{transform:rotate(360deg)}}
@keyframes raysIn{from{opacity:0}to{opacity:.16}}
.shock{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;border:2px solid var(--rarity,#c97eff);opacity:0;pointer-events:none}
.win.active .shock{animation:shockOut .85s cubic-bezier(.15,.7,.3,1)}
.win.active .shockLate{animation:shockOut 1.05s cubic-bezier(.15,.7,.3,1) .14s}
@keyframes shockOut{0%{opacity:.75;transform:scale(.5)}100%{opacity:0;transform:scale(3.4)}}
.burst{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.box{z-index:2}
.win.active .box.reveal{animation:boxReveal .62s cubic-bezier(.18,1.4,.35,1) both;box-shadow:0 0 90px var(--rarity,rgba(170,0,255,0.5));border-color:var(--rarity,rgba(180,80,255,0.6))}
@keyframes boxReveal{0%{opacity:0;transform:perspective(900px) translateY(26px) scale(.72) rotateX(14deg)}100%{opacity:1;transform:none}}
.box.reveal::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,0.32),transparent);transform:skewX(-14deg);pointer-events:none;animation:boxSheen 1.05s ease-out .42s both}
@keyframes boxSheen{from{left:-60%}to{left:125%}}
.box.reveal .caption{animation:captionRise .5s ease-out .28s both}
@keyframes captionRise{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.box .result .swatch span{display:none}
.rarityPill{display:inline-block;align-self:center;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:rgba(5,5,10,.55);border:1px solid currentColor}
.summaryEntry{animation:summaryIn .34s ease-out both}
@keyframes summaryIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rwl-low-fx .rays,.rwl-low-fx .shock,.rwl-low-fx .burst,.rwl-low-fx .box.reveal::after{display:none}
.rwl-low-fx .viewport.fast .track{filter:none}
@media (prefers-reduced-motion:reduce){.rays,.shock,.burst,.box.reveal::after{display:none}.viewport.fast .track{filter:none}.win.active .box.reveal,.summaryEntry,.box.reveal .caption{animation-duration:.01s;animation-delay:0s}}
</style>
<script src="../js/rwl_boot.js"></script>
</head>

<body>

<div class="bg"></div>

<div class="container">

<div class="phaseLabel" id="phaseLabel"></div>

<div class="frame" id="frame">
<span class="marker markerTop" aria-hidden="true"></span>
<span class="marker markerBottom" aria-hidden="true"></span>
<div class="viewport" id="viewport">
<div class="centerLine"></div>
<div class="track" id="track"></div>
</div>
</div>

<div class="actions">
<button class="spinBtn" id="spin" title="Spin the chest: first the category, then the item">SPIN CHEST</button>
<button class="openAllBtn" id="skipSpin" title="Skip the animation and show the reward now" hidden>SKIP</button>
<button class="openAllBtn" id="openTen" title="Open 10 chests at once" hidden>OPEN 10</button>
<button class="openAllBtn" id="openAll" title="Open all your chests at once without animation" hidden>OPEN MAX</button>
<span class="customOpen" id="customOpen" hidden>
<input type="number" id="customCount" min="1" step="1" inputmode="numeric" placeholder="Amount" title="How many chests do you want to open?">
<button class="openAllBtn" id="openCustom" title="Open the chosen amount of chests">OPEN</button>
</span>
<label class="skipToggle" title="Always skip the spin animation"><input type="checkbox" id="alwaysSkip"> <span>Skip Animation</span></label>
</div>
</div>

<div class="win" id="win">
<div class="rays" aria-hidden="true"></div>
<div class="shock" aria-hidden="true"></div>
<div class="shock shockLate" aria-hidden="true"></div>
<canvas class="burst" id="burst" aria-hidden="true"></canvas>
<div class="topBtn back" id="back" title="Back to the chest">←</div>
<div class="box" id="box"></div>
</div>

<button type="button" class="pageNav pageBack" id="pageBack" title="Back to the inventory" aria-label="Back to the inventory">←</button>
<button type="button" class="pageNav pageClose" id="pageClose" title="Close the chest opening" aria-label="Close the chest opening">✕</button>

<script src="../js/api_client.js"></script>
<script>
(function(){
const CATEGORY_IMAGES={
avatar_decorations:"../images/assets/inventory/avatar_decos_main.webp",
nameplates:"../images/assets/inventory/nameplates_main.webp",
name_colors:"../images/assets/inventory/name_colors_main.webp",
launcher_themes:"../images/assets/inventory/themes_main.webp",
nameplate_outlines:"../images/assets/inventory/nameplate_outlines_main.webp",
content_borders:"../images/assets/inventory/content_borders_main.webp",
licenses:"../images/assets/inventory/licenses_main.webp"
}
const CATEGORY_LABELS={
avatar_decorations:"Avatar Decoration",
nameplates:"Nameplate",
name_colors:"Name Color",
launcher_themes:"Theme",
nameplate_outlines:"Nameplate Outline",
content_borders:"Content Border",
licenses:"License"
}
const idleImages=Object.keys(CATEGORY_IMAGES).map(function(key){return CATEGORY_IMAGES[key]})
const ITEM_WIDTH=150
const ITEM_GAP=14
const TRACK_PADDING=120
const CATEGORY_SPIN_MS=4200
const ITEM_SPIN_MS=6800
const SETTLE_MS=460
const LAND_HOLD_MS=720
const FOCUS_RANGE=3
const FAST_SPEED_PX_PER_SECOND=1500
const BURST_COUNTS={"Common":22,"Uncommon":30,"Rare":42,"Epic":58,"Mythical":76,"Ultra Rare":92,"Ultra Mythical":120}
const MEDIA_WINDOW_BEFORE=12
const MEDIA_WINDOW_AFTER=4
const IDLE_SPEED_PX_PER_SECOND=42
const IDLE_ITEMS=12
const SKIP_STORAGE_KEY="rwl_chest_skip_animation"
const KEEP="--rwl-keep:1;"

const track=document.getElementById("track")
const frameEl=document.getElementById("frame")
const viewportEl=document.getElementById("viewport")
const markers=frameEl.querySelectorAll(".marker")
const burstCanvas=document.getElementById("burst")
const spin=document.getElementById("spin")
const openAll=document.getElementById("openAll")
const openTen=document.getElementById("openTen")
const skipSpin=document.getElementById("skipSpin")
const customOpen=document.getElementById("customOpen")
const customCount=document.getElementById("customCount")
const openCustom=document.getElementById("openCustom")
const alwaysSkip=document.getElementById("alwaysSkip")
const phaseLabel=document.getElementById("phaseLabel")
const win=document.getElementById("win")
const box=document.getElementById("box")
const esc=RWL.escapeHtml

let pos=0
let raf=null
let opening=false
let openedAny=false
let pendingResult=null
let lastChests=null
let idleLast=0
let idleWidth=0
let animationDone=null
let focusedCards=[]
let lastTickIndex=-1
let burstFrame=null

function motionAllowed(){
return !document.documentElement.classList.contains("rwl-low-fx")&&!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)
}

function centerIndexFloat(){
return (pos+viewportEl.clientWidth/2-TRACK_PADDING-ITEM_WIDTH/2)/(ITEM_WIDTH+ITEM_GAP)
}

function applyPosition(){
track.style.transform="translate3d("+(-pos)+"px,0,0)"
const center=centerIndexFloat()
const nearest=Math.round(center)
const cards=track.children
const next=[]
for(let index=Math.max(0,nearest-FOCUS_RANGE);index<=Math.min(cards.length-1,nearest+FOCUS_RANGE);index++){
const distance=Math.min(1,Math.abs(index-center)/FOCUS_RANGE)
const card=cards[index]
card.style.transform="scale("+(1.09-distance*0.17).toFixed(3)+")"
card.style.opacity=(1-distance*0.42).toFixed(3)
next.push(card)
}
focusedCards.forEach(function(card){
if(next.indexOf(card)<0){card.style.transform="";card.style.opacity=""}
})
focusedCards=next
return nearest
}

function pulseMarkers(){
if(!motionAllowed())return
markers.forEach(function(marker,index){
const lift=index===0?-5:5
marker.animate([{transform:"translateY("+lift+"px) scale(1.18)"},{transform:"none"}],{duration:130,easing:"ease-out"})
})
}

function setRarity(color){
const value=color||"#c97eff"
;[frameEl,track,win,box].forEach(function(element){
element.style.setProperty("--rwl-keep","1")
element.style.setProperty("--rarity",value)
})
}

function clearLanding(){
frameEl.classList.remove("landed")
track.classList.remove("landed")
const won=track.querySelector(".won")
if(won)won.classList.remove("won")
}

function landOn(index,color,hold,done){
setRarity(color)
frameEl.classList.remove("spinning")
if(skipEnabled()||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)){
done()
return
}
const card=track.children[index]
if(card)card.classList.add("won")
track.classList.add("landed")
frameEl.classList.add("landed")
setTimeout(done,hold)
}

function playBurst(rarity,color){
cancelAnimationFrame(burstFrame)
const context=burstCanvas.getContext("2d")
if(!context||!motionAllowed())return
const ratio=Math.min(window.devicePixelRatio||1,2)
burstCanvas.width=Math.round(burstCanvas.clientWidth*ratio)
burstCanvas.height=Math.round(burstCanvas.clientHeight*ratio)
context.setTransform(ratio,0,0,ratio,0,0)
const width=burstCanvas.clientWidth
const height=burstCanvas.clientHeight
const count=BURST_COUNTS[rarity]||30
const particles=[]
for(let index=0;index<count;index++){
const angle=Math.random()*Math.PI*2
const speed=120+Math.random()*420
particles.push({x:width/2,y:height/2,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,size:1.2+Math.random()*2.6,life:0.7+Math.random()*0.8,white:Math.random()<0.28})
}
let previous=performance.now()
let age=0
function draw(now){
const delta=Math.min(0.05,(now-previous)/1000)
previous=now
age+=delta
context.clearRect(0,0,width,height)
let alive=false
particles.forEach(function(particle){
const remaining=1-age/particle.life
if(remaining<=0)return
alive=true
particle.vx*=0.985
particle.vy=particle.vy*0.985+120*delta
particle.x+=particle.vx*delta
particle.y+=particle.vy*delta
context.globalAlpha=Math.max(0,remaining)
context.fillStyle=particle.white?"#ffffff":color
context.beginPath()
context.arc(particle.x,particle.y,particle.size,0,Math.PI*2)
context.fill()
})
context.globalAlpha=1
if(alive)burstFrame=requestAnimationFrame(draw)
else context.clearRect(0,0,width,height)
}
burstFrame=requestAnimationFrame(draw)
}

function categoryImage(category){
return CATEGORY_IMAGES[category]||idleImages[0]
}

function themeStripesHtml(item){
const colors=(item.preview||[]).map(function(color){return RWL.sanitizeHex(color,"#7b2cbf")})
if(item.animated&&colors.length>1){
const seconds=Math.max(4,Math.min(parseInt((item.animation||{}).period_seconds,10)||12,40))
return '<div class="themeStripes animatedStripes"><i style="'+KEEP+'background-image:linear-gradient(90deg,'+colors.concat([colors[0]]).join(",")+');animation:rwlNameRgb '+seconds+'s linear infinite;"></i></div>'
}
return '<div class="themeStripes">'+(colors.length?colors:["#7b2cbf"]).map(function(color){return '<i style="'+KEEP+'background:'+color+';"></i>'}).join("")+'</div>'
}

function itemVisualHtml(item,large){
if(!item)return '<img src="'+idleImages[0]+'" alt="">'
if(item.category==="name_colors"){
return '<div class="swatch" style="'+esc(RWL.swatchStyle(item))+'"><span translate="no">'+esc(item.name)+'</span></div>'
}
if(item.category==="nameplates"&&item.asset_url){
return '<video src="'+esc(item.asset_url)+'" muted loop playsinline preload="'+(large?"auto":"metadata")+'"'+(large?" autoplay":"")+'></video>'
}
if(item.category==="launcher_themes"){
return '<div class="labelVisual">'+themeStripesHtml(item)+'<div class="swatch" style="position:absolute;inset:0;"><span translate="no">'+esc(item.name||"Theme")+'</span></div></div>'
}
if(item.category==="licenses"){
return '<div class="labelVisual"><img class="contain" src="'+categoryImage("licenses")+'" alt=""><div class="swatch" style="position:absolute;inset:0;"><span>'+esc(item.name||"License")+'</span></div></div>'
}
if(item.category==="nameplate_outlines"||item.category==="content_borders"){
return '<div class="swatch'+RWL.frameClasses(item)+'" style="'+esc(RWL.frameStyle(item))+'"><span translate="no">'+esc(item.name||"Item")+'</span></div>'
}
if(item.category==="avatar_decorations"&&item.thumb_url&&!large){
return '<img class="contain" src="'+esc(item.thumb_url)+'" alt="">'
}
if(item.asset_url){
return '<img class="contain" src="'+esc(item.asset_url)+'" alt="">'
}
return '<div class="swatch"><span translate="no">'+esc(item.name||"Item")+'</span></div>'
}

function buildIdle(){
track.innerHTML=""
const sequence=[]
for(let i=0;i<IDLE_ITEMS;i++)sequence.push(idleImages[i%idleImages.length])
for(let round=0;round<4;round++){
sequence.forEach(function(source){
const d=document.createElement("div")
d.className="item"
d.innerHTML='<img src="'+source+'" alt="">'
track.appendChild(d)
})
}
idleWidth=IDLE_ITEMS*(ITEM_WIDTH+ITEM_GAP)
}

function idleLoop(now){
if(!idleLast)idleLast=now
const delta=Math.min(100,now-idleLast)
idleLast=now
pos=(pos+IDLE_SPEED_PX_PER_SECOND*delta/1000)%idleWidth
applyPosition()
raf=requestAnimationFrame(idleLoop)
}

function startIdle(){
cancelAnimationFrame(raf)
pos=0
idleLast=0
focusedCards=[]
clearLanding()
frameEl.classList.remove("spinning")
buildIdle()
raf=requestAnimationFrame(idleLoop)
}

function buildCategoryReel(reel){
track.innerHTML=""
reel.forEach(function(entry){
const d=document.createElement("div")
d.className="item category"
d.title=entry.label||CATEGORY_LABELS[entry.category]||"Item"
d.innerHTML='<img src="'+categoryImage(entry.category)+'" alt="'+esc(d.title)+'">'
track.appendChild(d)
})
}

function lightVisualHtml(item){
if(!item)return '<img src="'+idleImages[0]+'" alt="">'
if(item.category==="avatar_decorations"||item.category==="nameplates"){
return '<img src="'+categoryImage(item.category)+'" alt="">'
}
return itemVisualHtml(item,false)
}

function buildReel(reel,winIndex){
track.innerHTML=""
reel.forEach(function(item,index){
const d=document.createElement("div")
d.className="item"
d.style.cssText=KEEP+"border-color:"+RWL.rarityColor(item&&item.rarity)+";"
const nearWinner=index>=winIndex-MEDIA_WINDOW_BEFORE&&index<=winIndex+MEDIA_WINDOW_AFTER
d.innerHTML=nearWinner?itemVisualHtml(item,false):lightVisualHtml(item)
track.appendChild(d)
})
}

function preloadReward(reward){
if(!reward||!reward.asset_url)return
try{
if(reward.category==="avatar_decorations"){
const image=new Image()
image.decoding="async"
image.src=reward.asset_url
}else if(reward.category==="nameplates"){
fetch(reward.asset_url,{mode:"no-cors"}).catch(function(){})
}
}catch(error){}
}

function easeOutQuart(t){
return 1-Math.pow(1-t,4)
}

function easeInOutCubic(t){
return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2
}

function skipEnabled(){
return alwaysSkip.checked
}

function animateTo(index,duration,done){
cancelAnimationFrame(raf)
const rest=centerFor(index)
const target=targetFor(index)
animationDone=function(){
animationDone=null
cancelAnimationFrame(raf)
viewportEl.classList.remove("fast")
pos=rest
applyPosition()
skipSpin.hidden=true
done()
}
if(skipEnabled()){
animationDone()
return
}
clearLanding()
frameEl.classList.add("spinning")
skipSpin.hidden=false
const start=performance.now()
let previousPos=pos
let previousNow=start
lastTickIndex=-1
function settle(){
viewportEl.classList.remove("fast")
const from=pos
const settleStart=performance.now()
function settleStep(now){
const progress=Math.min(1,(now-settleStart)/SETTLE_MS)
pos=from+(rest-from)*easeInOutCubic(progress)
applyPosition()
if(progress<1)raf=requestAnimationFrame(settleStep)
else if(animationDone)animationDone()
}
raf=requestAnimationFrame(settleStep)
}
function step(now){
const progress=Math.min(1,(now-start)/duration)
pos=target*easeOutQuart(progress)
const nearest=applyPosition()
if(nearest!==lastTickIndex){
if(lastTickIndex>=0)pulseMarkers()
lastTickIndex=nearest
}
const speed=Math.abs(pos-previousPos)/Math.max(1,now-previousNow)*1000
previousPos=pos
previousNow=now
viewportEl.classList.toggle("fast",motionAllowed()&&speed>FAST_SPEED_PX_PER_SECOND)
if(progress<1)raf=requestAnimationFrame(step)
else settle()
}
raf=requestAnimationFrame(step)
}

function centerFor(winIndex){
return Math.max(0,TRACK_PADDING+winIndex*(ITEM_WIDTH+ITEM_GAP)+ITEM_WIDTH/2-viewportEl.clientWidth/2)
}

function targetFor(winIndex){
return Math.max(0,centerFor(winIndex)+(Math.random()-0.5)*(ITEM_WIDTH*0.6))
}

function setButton(text,disabled){
spin.textContent=text
spin.disabled=!!disabled
}

function chestButtonLabel(chests){
if(!chests)return "SPIN CHEST"
if(chests.unlimited)return "SPIN CHEST (∞)"
return chests.balance>0?"SPIN CHEST ("+chests.balance+" LEFT)":"NO CHESTS LEFT"
}

function updateOpenAll(chests){
lastChests=chests||lastChests
const current=lastChests||{}
const balance=parseInt(current.balance,10)||0
const unlimited=!!current.unlimited
const locked=opening||!!pendingResult
const limit=unlimited?(current.open_all_limit||10):Math.min(balance,current.open_all_limit||balance)
openTen.hidden=!(unlimited||balance>=10)
openTen.disabled=locked
openAll.hidden=unlimited||balance<2
openAll.disabled=locked
openAll.textContent="OPEN MAX ("+limit+")"
customOpen.hidden=!(unlimited||balance>=2)
customCount.max=String(limit)
customCount.placeholder=(unlimited?"Up to ":"1 - ")+limit
customCount.disabled=locked
openCustom.disabled=locked
}

function restoreChestButton(){
const chests=lastChests||{}
setButton(chestButtonLabel(chests),!chests.unlimited&&!(chests.balance>0))
updateOpenAll(chests)
}

function finish(result){
const reward=result.reward||{}
const notes=[]
if(reward.duplicate){
notes.push(reward.compensation_lab_coins?"Duplicate · +"+reward.compensation_lab_coins+" LC":"Duplicate · already owned")
}
if(reward.voucher){
notes.push("Voucher added to Special Items")
}
const rarityColor=RWL.rarityColor(reward.rarity)
box.style.cssText=KEEP
setRarity(rarityColor)
box.classList.remove("reveal")
box.innerHTML='<div class="result">'+itemVisualHtml(reward,true)+'<div class="caption"><span translate="no">'+esc(reward.name||"Item")+'</span><span class="rarityPill" style="'+KEEP+'color:'+esc(rarityColor)+';">'+esc(reward.rarity||"")+'</span><small>'+esc(reward.category_label||"")+'</small>'+(notes.length?'<small>'+esc(notes.join(" · "))+'</small>':"")+'</div></div>'
void box.offsetWidth
box.classList.add("reveal")
win.classList.add("active")
playBurst(reward.rarity,rarityColor)
pendingResult=null
phaseLabel.textContent=""
opening=false
restoreChestButton()
}

function spinItems(){
if(!pendingResult||opening)return
opening=true
setButton("SPINNING...",true)
updateOpenAll()
const result=pendingResult
const reel=Array.isArray(result.reel)&&result.reel.length?result.reel:[result.reward]
const winIndex=Math.max(0,Math.min(result.win_index||0,reel.length-1))
clearLanding()
focusedCards=[]
buildReel(reel,winIndex)
pos=0
applyPosition()
animateTo(winIndex,ITEM_SPIN_MS,function(){
landOn(winIndex,RWL.rarityColor((result.reward||{}).rarity),LAND_HOLD_MS,function(){finish(result)})
})
}

function categoryLanded(result){
opening=false
pendingResult=result
const label=(result.category_label||CATEGORY_LABELS[result.category]||"Item").toUpperCase()
phaseLabel.textContent="Category: "+(result.category_label||CATEGORY_LABELS[result.category]||"Item")
phaseLabel.classList.remove("pop")
void phaseLabel.offsetWidth
phaseLabel.classList.add("pop")
setButton("SPIN "+label,false)
updateOpenAll()
}

async function spinChest(){
if(pendingResult){
spinItems()
return
}
if(opening)return
if(!RWL.getToken()){
setButton("LOGIN REQUIRED",true)
return
}
opening=true
setButton("OPENING...",true)
updateOpenAll()
phaseLabel.textContent=""
let result
try{
result=await RWL.apiRequest("/api/chests/open",{method:"POST"})
}catch(error){
opening=false
const noChests=error.status===400
setButton(noChests?"NO CHESTS LEFT":"TRY AGAIN",noChests)
updateOpenAll()
if(!noChests)setTimeout(function(){setButton("SPIN CHEST",false)},2500)
return
}
openedAny=true
lastChests=result.chests||lastChests
preloadReward(result.reward)
const categoryReel=Array.isArray(result.category_reel)&&result.category_reel.length?result.category_reel:[{category:(result.reward||{}).category,label:result.category_label}]
const categoryIndex=Math.max(0,Math.min(result.category_win_index||0,categoryReel.length-1))
setButton("SPINNING...",true)
clearLanding()
focusedCards=[]
buildCategoryReel(categoryReel)
pos=0
applyPosition()
animateTo(categoryIndex,CATEGORY_SPIN_MS,function(){
landOn(categoryIndex,"#c97eff",0,function(){categoryLanded(result)})
})
}

function showSummary(result){
const rewards=result.rewards||[]
let html='<div class="summary"><h2>'+esc(String(result.opened||rewards.length))+' chests opened</h2>'
html+='<div class="summaryMeta">'+(result.lab_coins_awarded?esc("+"+result.lab_coins_awarded+" LC for duplicates · "):"")+'All rewards were added to your inventory.</div>'
html+='<div class="summaryGrid">'
rewards.forEach(function(reward,index){
const note=reward.duplicate?(reward.compensation_lab_coins?"Duplicate · +"+reward.compensation_lab_coins+" LC":"Duplicate · already owned"):(reward.voucher?"Voucher added to Special Items":"Added to your locker")
html+='<div class="summaryEntry" style="'+KEEP+'border-color:'+esc(RWL.rarityColor(reward.rarity))+';animation-delay:'+Math.min(index*28,900)+'ms;"><strong translate="no">'+esc(reward.name||"Item")+'</strong><span style="'+KEEP+'color:'+esc(RWL.rarityColor(reward.rarity))+';">'+esc(reward.rarity||"")+'</span><span>'+esc(reward.category_label||"")+'</span><span>'+esc(note)+'</span></div>'
})
html+='</div></div>'
box.classList.remove("reveal")
box.style.cssText="width:auto;height:auto;background:transparent;border:none;box-shadow:none;overflow:visible;"
box.innerHTML=html
setRarity("#c97eff")
win.classList.add("active")
playBurst("Rare","#c97eff")
}

function requestCustomOpen(){
const current=lastChests||{}
const limit=parseInt(customCount.max,10)||1
const value=parseInt(customCount.value,10)
const valid=value>=1&&value<=limit&&String(value)===String(customCount.value).trim()
customCount.classList.toggle("invalidInput",!valid)
if(!valid)return
openMany({count:value})
}

async function openMany(body){
if(opening||pendingResult)return
if(!RWL.getToken()){
setButton("LOGIN REQUIRED",true)
return
}
opening=true
openAll.disabled=true
openTen.disabled=true
openCustom.disabled=true
setButton("OPENING...",true)
try{
const result=await RWL.apiRequest("/api/chests/open_many",{method:"POST",body:body})
openedAny=true
lastChests=result.chests||lastChests
opening=false
restoreChestButton()
showSummary(result)
}catch(error){
opening=false
restoreChestButton()
phaseLabel.textContent=error.status===429?"You are opening chests too fast. Please wait a moment.":(error.message||"The chests could not be opened.")
}
}

function backToChest(){
win.classList.remove("active")
box.classList.remove("reveal")
box.innerHTML=""
box.style.cssText=""
cancelAnimationFrame(burstFrame)
const context=burstCanvas.getContext("2d")
if(context)context.clearRect(0,0,burstCanvas.width,burstCanvas.height)
if(!spin.disabled&&!pendingResult)startIdle()
}

function exitChest(){
const interrupted=opening||!!pendingResult
win.classList.remove("active")
window.parent.postMessage({type:"chest_opening_done",opened:openedAny||interrupted,interrupted:interrupted},window.location.origin)
}

async function loadSummary(){
if(!RWL.getToken()){
setButton("LOGIN REQUIRED",true)
openAll.disabled=true
return
}
try{
const chests=await RWL.apiRequest("/api/chests")
lastChests=chests
restoreChestButton()
}catch(error){
setButton("SPIN CHEST",false)
}
}

spin.onclick=spinChest
openAll.onclick=function(){openMany({use_max:true})}
openTen.onclick=function(){openMany({count:10})}
openCustom.onclick=requestCustomOpen
customCount.addEventListener("input",function(){customCount.classList.remove("invalidInput")})
skipSpin.onclick=function(){if(animationDone)animationDone()}
alwaysSkip.checked=localStorage.getItem(SKIP_STORAGE_KEY)==="1"
alwaysSkip.addEventListener("change",function(){
if(alwaysSkip.checked)localStorage.setItem(SKIP_STORAGE_KEY,"1")
else localStorage.removeItem(SKIP_STORAGE_KEY)
})
document.getElementById("back").onclick=backToChest
document.getElementById("pageBack").onclick=exitChest
document.getElementById("pageClose").onclick=exitChest
win.onclick=function(e){
if(e.target===win)backToChest()
}
document.addEventListener("keydown",function(e){
if(e.key==="Escape"){
if(win.classList.contains("active"))backToChest()
else exitChest()
}
})

RWL.ensureCosmeticStyles()
startIdle()
loadSummary()
})()
</script>
