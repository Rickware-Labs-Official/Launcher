<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin Chest Fixed</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:#05050a;
overflow:hidden;
}

.bg{
position:absolute;
inset:0;
background:
radial-gradient(circle at 50% 40%,rgba(170,0,255,0.25),transparent 60%),
linear-gradient(120deg,#04040a,#0b0b18);
}

.container{
width:100%;
max-width:1000px;
padding:20px;
z-index:2;
position:relative;
display:flex;
flex-direction:column;
align-items:center;
gap:30px;
}

.frame{
width:100%;
height:210px;
border-radius:18px;
position:relative;
overflow:hidden;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(16px);
box-shadow:0 0 80px rgba(170,0,255,0.2);
border:1px solid rgba(160,0,255,0.15);
}

.frame::before{
content:"";
position:absolute;
inset:0;
border-radius:18px;
padding:2px;
background:linear-gradient(90deg,
rgba(180,0,255,0.9),
rgba(120,0,255,0.2),
rgba(180,0,255,0.9)
);
mask:
linear-gradient(#000 0 0) content-box,
linear-gradient(#000 0 0);
mask-composite:exclude;
opacity:.8;
pointer-events:none;
}

.centerLine{
position:absolute;
top:0;
left:50%;
width:3px;
height:100%;
transform:translateX(-50%);
background:linear-gradient(to bottom,transparent,#c200ff,transparent);
box-shadow:0 0 18px #c200ff;
z-index:5;
}

.viewport{
position:absolute;
inset:10px;
border-radius:14px;
overflow:hidden;
}

.track{
display:flex;
gap:14px;
position:absolute;
height:100%;
align-items:center;
padding:0 120px;
will-change:transform;
transform:translateZ(0);
}

.item{
min-width:150px;
height:130px;
border-radius:14px;
overflow:hidden;
background:rgba(255,255,255,0.05);
border:1px solid rgba(180,80,255,0.25);
flex-shrink:0;
}

.item img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.spinBtn{
width:420px;
padding:18px;
font-size:20px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#b100ff,#5200ff);
color:white;
cursor:pointer;
box-shadow:0 0 60px rgba(170,0,255,0.5);
animation:float 2s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-6px)}
}

.win{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
background:rgba(0,0,0,0.75);
backdrop-filter:blur(10px);
opacity:0;
pointer-events:none;
transition:.25s;
z-index:9999;
}

.win.active{
opacity:1;
pointer-events:auto;
}

.box{
width:360px;
height:360px;
border-radius:18px;
overflow:hidden;
background:rgba(255,255,255,0.05);
border:1px solid rgba(180,80,255,0.4);
box-shadow:0 0 120px rgba(170,0,255,0.5);
position:relative;
display:flex;
align-items:center;
justify-content:center;
}

.topBtn{
position:absolute;
top:15px;
width:44px;
height:44px;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
background:rgba(255,255,255,0.06);
border:1px solid rgba(180,80,255,0.3);
z-index:10000;
}

.close{right:15px}
.back{left:15px}

.box img{
width:100%;
height:100%;
object-fit:cover;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<div class="frame">
<div class="viewport">
<div class="centerLine"></div>
<div class="track" id="track"></div>
</div>
</div>

<button class="spinBtn" id="spin">SPIN CHEST</button>
</div>

<div class="win" id="win">
<div class="topBtn back" id="back">←</div>
<div class="topBtn close" id="close">✕</div>
<div class="box" id="box"></div>
</div>

<script>
const items=[
"../images/assets/inventory/avatar_decos_main.webp",
"../images/assets/inventory/nameplates_main.webp",
"../images/assets/inventory/name_colors_main.webp",
"../images/assets/inventory/themes_main.webp",
"../images/assets/inventory/licenses_main.webp"
]

const track=document.getElementById("track")
const spin=document.getElementById("spin")
const win=document.getElementById("win")
const box=document.getElementById("box")

let pos=0
let speed=6
let raf

function build(){
track.innerHTML=""
for(let i=0;i<50;i++){
const src=items[Math.floor(Math.random()*items.length)]
const d=document.createElement("div")
d.className="item"
d.innerHTML=`<img src="${src}">`
track.appendChild(d)
}
}

function loop(){
pos+=speed
if(pos>2400)pos=0
track.style.transform=`translateX(${-pos}px)`
raf=requestAnimationFrame(loop)
}

build()
loop()

function spinChest(){
cancelAnimationFrame(raf)

pos=0
speed=Math.random()<0.3?48:30

function run(){
speed*=0.985
pos+=speed

track.style.transform=`translateX(${-pos}px)`

if(speed<0.4){
finish()
return
}

raf=requestAnimationFrame(run)
}
raf=requestAnimationFrame(run)
}

function finish(){
const r=items[Math.floor(Math.random()*items.length)]
box.innerHTML=`<img src="${r}">`
win.classList.add("active")
}

function closeWin(){
win.classList.remove("active")
window.parent.postMessage('chest_opening_done', '*')
}

spin.onclick=spinChest
document.getElementById("close").onclick=closeWin
document.getElementById("back").onclick=closeWin

win.onclick=(e)=>{
if(e.target===win) closeWin()
}
</script>

</body>
</html>
