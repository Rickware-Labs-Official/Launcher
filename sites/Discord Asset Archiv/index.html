<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0d0914">
    <title>Rickware - Labs© - Asset Archive</title>
    <link rel="preconnect" href="https://rickware-labs-api.apps.bot-hosting.cloud" crossorigin>
    <link rel="icon" type="image/webp" href="../../images/main/logo.webp">
    <link rel="apple-touch-icon" href="../../images/main/logo.webp">
    <link rel="stylesheet" href="./css/main.css">
    <script src="../../js/rwl_boot.js"></script>
</head>
<body>
    <div class="application-shell">
        <aside class="sidebar-panel">
            <div class="brand-header">
                <div class="brand-logo-wrapper">
                    <img src="../../images/main/logo.webp" alt="Rickware - Labs© Logo" class="brand-logo-image" id="brandLogoImage" decoding="async">
                </div>
                <div class="brand-title-group">
                    <h1 class="brand-main-title" id="brandMainTitle">Rickware - Labs©</h1>
                    <span class="brand-subtitle" id="sidebarVersionBadge">Asset Archive</span>
                </div>
            </div>

            <div class="sidebar-divider"></div>

            <section class="sidebar-status-panel" aria-label="Archive status">
                <span class="sidebar-section-label">Archive Status</span>
                <div class="status-row">
                    <span class="status-row-label">Source</span>
                    <span class="status-row-value"><span class="status-live-dot status-dot-warning" id="statusSourceDot"></span><span id="statusSourceValue">Loading</span></span>
                </div>
                <div class="status-row">
                    <span class="status-row-label">Total Assets</span>
                    <span class="status-row-value" id="statusTotalValue">0</span>
                </div>
                <div class="status-row">
                    <span class="status-row-label">Total Size</span>
                    <span class="status-row-value" id="statusSizeValue">–</span>
                </div>
                <div class="status-row">
                    <span class="status-row-label">Last Update</span>
                    <span class="status-row-value" id="statusUpdateValue">–</span>
                </div>
            </section>

            <div class="sidebar-spacer"></div>

            <div class="sidebar-actions-group">
                <button type="button" class="glow-button inner-shine-button sidebar-action-button" id="backToStoreButton" data-tooltip="Return to the Rickware - Labs© store">
                    <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5"></path>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                    <span>Back to Store</span>
                </button>

                <button type="button" class="glow-button inner-shine-button sidebar-action-button" id="openLauncherButton" data-tooltip="Open the official Rickware - Labs© Launcher in a new tab">
                    <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                    <span>Launcher</span>
                </button>

                <button type="button" class="glow-button inner-shine-button sidebar-action-button discord-accent-button" id="joinDiscordButton" data-tooltip="Join the official Rickware - Labs© Discord community">
                    <svg class="button-icon discord-svg-icon" viewBox="0 0 127.14 96.36" fill="currentColor">
                        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
                    </svg>
                    <span>Join Discord</span>
                </button>
            </div>
        </aside>

        <main class="main-workspace" id="mainScrollableWorkspace">
            <header class="workspace-top-header">
                <div class="counter-grid" id="categoryCounterGrid"></div>
            </header>

            <nav class="navigation-tabs-bar" aria-label="Asset Categories">
                <div class="category-tabs-left" id="categoryTabsContainer"></div>

                <div class="category-tabs-right">
                    <button type="button" class="glow-button inner-shine-button github-scraper-tab-button" id="assetScraperGithubButton" data-tooltip="Open the Asset Scraper repository on GitHub">
                        <svg class="github-tab-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                        </svg>
                        <span>Asset Scraper</span>
                    </button>
                </div>
            </nav>

            <div class="preview-profile-notice" id="previewProfileNotice" role="status">
                <span id="previewProfileText"></span>
                <button type="button" class="glow-button preview-profile-signin hidden-element" id="previewProfileSignIn" data-tooltip="Sign in to preview assets on your own profile">Sign In</button>
            </div>

            <section class="toolbar-controls-section">
                <div class="search-box-container">
                    <svg class="search-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="assetSearchInput" class="modern-search-input" placeholder="Search assets in current category by name..." autocomplete="off" spellcheck="false" maxlength="120" aria-describedby="validationFeedbackBanner">
                    <button type="button" class="glow-button clear-search-button" id="clearSearchInputButton" data-tooltip="Clear the current search filter">Clear</button>
                </div>

                <div class="toolbar-right-actions">
                    <div class="per-page-selector-wrapper">
                        <label for="itemsPerPageSelect" class="control-label">Assets / Page:</label>
                        <select id="itemsPerPageSelect" class="custom-rounded-dropdown">
                            <option value="4">4 (Ultra Low-End)</option>
                            <option value="8" selected>8 (Recommended)</option>
                            <option value="12">12 (Balanced)</option>
                            <option value="16">16 (High Density)</option>
                        </select>
                    </div>

                    <button type="button" class="glow-button inner-shine-button download-all-button" id="downloadAllCategoryButton" data-tooltip="Download every asset in the current view (category and search filter) as ZIP archives">
                        <span class="download-progress-fill" id="downloadAllProgressFill"></span>
                        <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        <span id="downloadAllButtonText">Download All</span>
                    </button>
                </div>
            </section>

            <div id="validationFeedbackBanner" class="validation-feedback-banner hidden-element" role="alert"></div>

            <section class="assets-grid-container" id="assetsGridContainer" aria-live="polite"></section>

            <section class="pagination-controls-bar" id="paginationControlsBar">
                <button type="button" class="glow-button pagination-nav-button" id="previousPageButton" data-tooltip="Go to the previous page of assets (Arrow Left)">Previous</button>
                <div class="pagination-numbers-group" id="paginationNumbersGroup"></div>
                <button type="button" class="glow-button pagination-nav-button" id="nextPageButton" data-tooltip="Go to the next page of assets (Arrow Right)">Next</button>
            </section>

            <footer class="application-footer">
                <div class="footer-primary-line">
                    <span>Made with <span class="heart-pulse">❤</span> by Rickware - Labs©</span>
                </div>
                <div class="footer-secondary-line">
                    <span>Rickware - Labs© Asset Archive • Author: <strong class="author-signature">.rick.c137</strong></span>
                </div>
            </footer>
        </main>
    </div>

    <div id="customTooltipBox" class="custom-tooltip-box hidden-element" role="tooltip"></div>
    <div id="toastNotificationContainer" class="toast-notification-container" aria-live="polite"></div>
    <button type="button" class="glow-button inner-shine-button back-to-top-button" id="backToTopButton" data-tooltip="Smoothly scroll back to the top of the page" aria-label="Back to top">
        <svg class="back-to-top-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="18 15 12 9 6 15"></polyline>
        </svg>
    </button>

    <script src="../../js/api_client.js"></script>
    <script src="./config/config.js"></script>
    <script src="./config/archive_routes.js"></script>
    <script src="./config/archive_labels.js"></script>
    <script src="./js/modules/asset_utils.js"></script>
    <script src="./js/modules/archive_api.js"></script>
    <script src="./js/modules/download_manager.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
