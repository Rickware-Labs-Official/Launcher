<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rickware - Labs© - Locker &amp; Inventory</title>
    <link rel="stylesheet" href="../css/inventory.css">
    <link rel="icon" type="image/webp" href="../images/main/logo.webp">
</head>
<body>

    <a href="../index.html" class="inv-back-btn" aria-label="Back to launcher">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6"></path>
        </svg>
    </a>

    <div class="inv-sidebar-panel">
        <div class="inv-equipped-wrapper" id="invEquippedWrapper">
            <div class="inv-equipped-static">
                <div class="inv-equipped-panel-title">Currently Equipped</div>
                <div class="inv-equipped-list" id="invEquippedList"></div>
            </div>
        </div>

        <div class="inv-labpass-promo">
            <div class="inv-labpass-promo-badge">-20%</div>
            <div class="inv-labpass-promo-header">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c97eff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span>Lab-Pass Bundle</span>
            </div>
            <div class="inv-labpass-promo-sub">Pass + 10 Levels</div>
            <div class="inv-labpass-promo-body">
                <img src="./images/assets/lab_pass/rickware-labs_chest.webp" alt="Chest" class="inv-labpass-chest-img" onerror="this.style.display='none'">
                <div class="inv-labpass-promo-price">
                    <span class="inv-labpass-price-new">69 LC</span>
                    <span class="inv-labpass-price-old">80 LC</span>
                </div>
            </div>
            <button class="inv-labpass-buy-btn" id="invLabPassBuyBtn">Buy Bundle</button>
            <button class="inv-labpass-free-btn" id="invLabPassFreeBtn">Go To Free-Pass</button>
        </div>
    </div>

    <h1 class="inv-page-title">Locker &amp; Inventory</h1>

    <div class="inv-page-wrap">

        <div class="inv-loading-state" id="invLoadingState">
            <div class="inv-spinner"></div>
            <span>Loading your locker...</span>
        </div>

        <div class="inv-content" id="invContent">

            <div class="inv-section">
                <div class="inv-section-label">Locker Items</div>
                <div class="inv-grid" id="invLockerGrid"></div>
            </div>

            <div class="inv-section">
                <div class="inv-section-label">Inventory Items</div>
                <div class="inv-grid" id="invInventoryGrid"></div>
            </div>

            <div class="inv-glass-card inv-footer-bar">
                <button class="inv-view-all-btn" id="invViewAllBtn">View All Rewards</button>
            </div>

        </div>

    </div>

    <div class="inv-overlay" id="invModalOverlay">
        <div class="inv-modal" id="invModal">
            <div class="inv-modal-header">
                <div class="inv-modal-icon" id="invModalIcon"></div>
                <div class="inv-modal-title-block">
                    <div class="inv-modal-title" id="invModalTitle"></div>
                    <div class="inv-modal-subtitle" id="invModalSubtitle"></div>
                </div>
                <button class="inv-modal-close" id="invModalClose" aria-label="Close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="inv-modal-body" id="invModalBody"></div>
        </div>
    </div>

    <div class="inv-chest-iframe-overlay" id="invChestIframeOverlay">
        <iframe id="invChestIframe" src="" frameborder="0"></iframe>
    </div>

    <script src="../js/inventory.js"></script>
</body>
</html>
