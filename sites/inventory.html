<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rickware - Labs© - Locker &amp; Inventory</title>
    <link rel="preconnect" href="https://rickware-labs-api.apps.bot-hosting.cloud" crossorigin>
    <link rel="stylesheet" href="../css/inventory.css">
    <link rel="icon" type="image/webp" href="../images/main/logo.webp">
    <script src="../js/rwl_boot.js"></script>
</head>
<body>

    <a href="../index.html" class="inv-back-btn" aria-label="Back to launcher" title="Back to Store">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"></path>
        </svg>
    </a>

    <div class="inv-page-wrap">

        <div class="inv-top-row">

            <div class="inv-left-column">

                <div class="inv-header-section">
                    <div class="inv-header-left">
                        <div class="inv-header-icon-wrap">
                            <svg class="inv-header-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="url(#invHeaderGrad)" stroke-width="1.5">
                                <defs>
                                    <linearGradient id="invHeaderGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
                                        <stop offset="0%" stop-color="#c97eff"/>
                                        <stop offset="100%" stop-color="#6a00b8"/>
                                    </linearGradient>
                                </defs>
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M3 9h18"/>
                                <path d="M9 21V9"/>
                                <circle cx="15" cy="15" r="1.2" fill="#c97eff" stroke="none"/>
                            </svg>
                        </div>
                        <div class="inv-title-block">
                            <h1 class="inv-page-title">Locker &amp; Inventory</h1>
                            <div class="inv-header-subtitle">Cosmetics, Mystery Chests and Licenses</div>
                        </div>
                    </div>
                    <div class="inv-header-stats" id="invHeaderStats">
                        <div class="inv-header-stat" title="Cosmetic items you own">
                            <span class="inv-header-stat-value" id="invStatItems">0</span>
                            <span class="inv-header-stat-label">Items Owned</span>
                        </div>
                        <div class="inv-header-stat" title="Mystery Chests ready to open">
                            <span class="inv-header-stat-value" id="invStatChests">0</span>
                            <span class="inv-header-stat-label">Mystery Chests</span>
                        </div>
                        <div class="inv-header-stat" title="Items you have not looked at yet">
                            <span class="inv-header-stat-value" id="invStatNew">0</span>
                            <span class="inv-header-stat-label">New Items</span>
                        </div>
                    </div>
                </div>

                <div class="inv-loading-state" id="invLoadingState">
                    <div class="inv-spinner"></div>
                    <span>Loading your locker...</span>
                </div>

                <div class="inv-content" id="invContent">

                    <div class="inv-section inv-glass-card">
                        <div class="inv-section-label">Locker Items</div>
                        <div class="inv-grid" id="invLockerGrid"></div>
                    </div>

                    <div class="inv-section inv-glass-card">
                        <div class="inv-section-label">Inventory Items</div>
                        <div class="inv-grid" id="invInventoryGrid"></div>
                    </div>

                    <div class="inv-glass-card inv-footer-bar">
                        <div class="inv-footer-hint">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                            <span>Click an item to equip it. New items are marked with NEW.</span>
                        </div>
                        <button class="inv-view-all-btn" id="invViewAllBtn" title="Open the Lab-Pass and see every reward">View All Rewards</button>
                    </div>

                </div>

            </div>

            <div class="inv-sidebar-panel">
                <div class="inv-equipped-wrapper" id="invEquippedWrapper">
                    <div class="inv-equipped-static">
                        <div class="inv-equipped-panel-title">Currently Equipped</div>
                        <div class="inv-equipped-list" id="invEquippedList"></div>
                    </div>
                </div>

                <div class="inv-labpass-promo">
                    <div class="inv-labpass-promo-badge">-20%</div>
                    <div class="inv-labpass-promo-header">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c97eff" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <span>Lab-Pass Bundle</span>
                    </div>
                    <div class="inv-labpass-promo-sub">Pass + 10 Levels</div>
                    <div class="inv-labpass-promo-body">
                        <img src="../images/assets/lab_pass/rickware-labs_chest.webp" alt="Chest" class="inv-labpass-chest-img" width="52" height="52" decoding="async" onerror="this.style.display='none'">
                        <div class="inv-labpass-promo-price">
                            <span class="inv-labpass-price-new">69 LC</span>
                            <span class="inv-labpass-price-old">80 LC</span>
                        </div>
                    </div>
                    <button class="inv-labpass-buy-btn" id="invLabPassBuyBtn" title="Open the Lab-Pass to buy the bundle">Buy Bundle</button>
                    <button class="inv-labpass-free-btn" id="invLabPassFreeBtn" title="Open the free Lab-Pass track">Go To Free-Pass</button>
                </div>
            </div>

        </div>

    </div>

    <div class="inv-overlay" id="invModalOverlay">
        <div class="inv-modal" id="invModal">
            <div class="inv-modal-header">
                <div class="inv-modal-icon" id="invModalIcon"></div>
                <div class="inv-modal-title-block">
                    <div class="inv-modal-title" id="invModalTitle"></div>
                    <div class="inv-modal-subtitle" id="invModalSubtitle"></div>
                </div>
                <button class="inv-modal-close" id="invModalClose" aria-label="Close" title="Close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="inv-modal-body" id="invModalBody"></div>
        </div>
    </div>

    <div class="inv-chest-iframe-overlay" id="invChestIframeOverlay">
        <iframe id="invChestIframe" src="" frameborder="0" title="Mystery Chest"></iframe>
    </div>

    <script src="../js/api_client.js"></script>
    <script src="../js/launcher_bridge.js"></script>
    <script src="../js/rwl_fx.js"></script>
    <script src="../js/inventory.js"></script>
</body>
</html>
